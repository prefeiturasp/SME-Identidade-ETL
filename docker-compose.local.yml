# =============================================================================
# ETL-MS — ambiente de desenvolvimento local
# Uso: docker compose --env-file .env.local -f docker-compose.local.yml up -d --build
# Requer: rede sme-identidade criada + Keycloak rodando (docker-compose.local-infra.yml)
# Credenciais: arquivo .env.local (copiar de .env.local.example e ajustar)
#   Variáveis obrigatórias: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — banco do ETL (staging, logs de execução, celery-results)
  # ---------------------------------------------------------------------------
  etl-postgres:
    image: postgres:16-alpine
    container_name: local-etl-postgres
    ports:
      - "5437:5432"
    environment:
      POSTGRES_DB: ${ETL_POSTGRES_DB:-etl_db}
      POSTGRES_USER: ${ETL_POSTGRES_USER:-etl}
      POSTGRES_PASSWORD: ${ETL_POSTGRES_PASSWORD:?Defina ETL_POSTGRES_PASSWORD no .env.local}
    volumes:
      - local_etl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # KeyDB — broker Celery do ETL (porta 6382 para não colidir com outros serviços)
  # ---------------------------------------------------------------------------
  etl-keydb:
    image: eqalpha/keydb:alpine_x86_64_v6.3.4
    container_name: local-etl-keydb
    command: keydb-server --server-threads 2 --appendonly yes
    ports:
      - "6382:6379"
    volumes:
      - local_etl_keydb:/data
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # ETL-MS API (Django 5 + DRF + Gunicorn) — porta 8001
  # Roda migrate antes de iniciar o gunicorn (ver Dockerfile CMD)
  # ---------------------------------------------------------------------------
  etl-api:
    build: .
    container_name: local-etl-api
    ports:
      - "8001:8001"
    env_file:
      - .env.local
    environment:
      # Sobrescreve os valores de .env.local para apontar aos containers locais
      DATABASE_URL: postgresql://${ETL_POSTGRES_USER:-etl}:${ETL_POSTGRES_PASSWORD}@etl-postgres:5432/${ETL_POSTGRES_DB:-etl_db}
      CELERY_BROKER_URL: redis://etl-keydb:6379/0
      CELERY_RESULT_BACKEND: redis://etl-keydb:6379/1
      KEYCLOAK_SERVER_URL: http://keycloak:8080/
      KEYCLOAK_VERIFY_SSL: "false"
      TOKEN_MS_URL: http://token-ms-api:8003
      TOKEN_MS_INTERNAL_TOKEN: dev-internal-token
      DEBUG: "true"
    depends_on:
      etl-postgres:
        condition: service_healthy
      etl-keydb:
        condition: service_healthy
    networks:
      - default
      - identidade-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/api/health/"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ---------------------------------------------------------------------------
  # Celery Worker — processa filas de extract / transform / load
  # ---------------------------------------------------------------------------
  etl-worker:
    build: .
    container_name: local-etl-worker
    # concurrency=2 para ambiente local — reduz pressão de memória e evita SIGKILL por OOM
    # max-tasks-per-child recicla o processo após 50 tarefas, liberando memória acumulada
    command: celery -A etl_ms worker --loglevel=info --concurrency=2 --max-tasks-per-child=50 -Q etl_extract,etl_transform,etl_load,celery
    mem_limit: 4g
    memswap_limit: 4g
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${ETL_POSTGRES_USER:-etl}:${ETL_POSTGRES_PASSWORD}@etl-postgres:5432/${ETL_POSTGRES_DB:-etl_db}
      CELERY_BROKER_URL: redis://etl-keydb:6379/0
      CELERY_RESULT_BACKEND: redis://etl-keydb:6379/1
      KEYCLOAK_SERVER_URL: http://keycloak:8080/
      KEYCLOAK_VERIFY_SSL: "false"
      TOKEN_MS_URL: http://token-ms-api:8003
      TOKEN_MS_INTERNAL_TOKEN: dev-internal-token
      DEBUG: "true"
    depends_on:
      etl-postgres:
        condition: service_healthy
      etl-keydb:
        condition: service_healthy
    networks:
      - default
      - identidade-net
    healthcheck:
      disable: true

  # ---------------------------------------------------------------------------
  # Celery Beat — agendamento de tarefas periódicas (usa banco como scheduler)
  # ---------------------------------------------------------------------------
  etl-beat:
    build: .
    container_name: local-etl-beat
    command: celery -A etl_ms beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env.local
    environment:
      DATABASE_URL: postgresql://${ETL_POSTGRES_USER:-etl}:${ETL_POSTGRES_PASSWORD}@etl-postgres:5432/${ETL_POSTGRES_DB:-etl_db}
      CELERY_BROKER_URL: redis://etl-keydb:6379/0
      CELERY_RESULT_BACKEND: redis://etl-keydb:6379/1
      KEYCLOAK_SERVER_URL: http://keycloak:8080/
      KEYCLOAK_VERIFY_SSL: "false"
      DEBUG: "true"
    depends_on:
      etl-postgres:
        condition: service_healthy
      etl-keydb:
        condition: service_healthy
    networks:
      - default
      - identidade-net
    healthcheck:
      disable: true

networks:
  default:
    name: sme-identidade
    external: true
  identidade-net:
    name: api_identidade-net
    external: true

volumes:
  local_etl_pg:
  local_etl_keydb: