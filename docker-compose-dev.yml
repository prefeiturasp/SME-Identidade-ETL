services:
  postgres_sync_rec:
    image: postgres:15-alpine
    container_name: sme_identidade_etl_sync_rec_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${SYNC_REC_DB_NAME:-identidade_sync_rec}
    ports:
      - "5440:5432"
    volumes:
      - identidade_sync_rec_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${SYNC_REC_DB_NAME:-identidade_sync_rec}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keydb:
    image: eqalpha/keydb:latest
    container_name: sme_identidade_etl_keydb
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "keydb-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3 workers separados por fila, replicando os 3 deployments reais do
  # Rancher (keycloak, token_ms, celery) — uma etapa longa (ex.:
  # Keycloak com volume grande) não deve bloquear outras filas atrás
  # dela, o que aconteceria num único worker escutando tudo.
  etl_worker_celery:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sme_identidade_etl_worker_celery_dev
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      ETL_WORKER_FILAS: "celery,etl_extracao,etl_transformacao"
    volumes:
      - .:/app
    command: python /app/scripts/watch_celery.py
    restart: unless-stopped

  etl_worker_keycloak:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sme_identidade_etl_worker_keycloak_dev
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      ETL_WORKER_FILAS: "etl_carga_keycloak"
    volumes:
      - .:/app
    command: python /app/scripts/watch_celery.py
    restart: unless-stopped

  etl_worker_token_ms:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sme_identidade_etl_worker_token_ms_dev
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      ETL_WORKER_FILAS: "etl_carga_token_ms"
    volumes:
      - .:/app
    command: python /app/scripts/watch_celery.py
    restart: unless-stopped

  etl_api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: sme_identidade_etl_api_dev
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    volumes:
      - .:/app
    command: >
      python -Xfrozen_modules=off -m debugpy
      --listen 0.0.0.0:5668 manage.py runserver 0.0.0.0:8001
    ports:
      - "${PORT_WEB:-8001}:8001"
      - "${PORT_DEBUGPY:-5668}:5668"
    restart: unless-stopped

  etl_flower:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sme_identidade_etl_flower_dev
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    entrypoint: []
    command: >
      celery -A config.celery:app flower
      --port=5555
    ports:
      - "${PORT_FLOWER:-5555}:5555"
    restart: unless-stopped

volumes:
  identidade_sync_rec_data:
