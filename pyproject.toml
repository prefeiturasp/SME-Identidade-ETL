[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SME-Identidade-ETL"
version = "0.1.0"
description = "Microsserviço ETL para ingestão, reconciliação e provisionamento de identidades SME-SP"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "SME" }]

[project.optional-dependencies]
docs = [
    "sphinx>=7.3",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=3.0",
    "sphinx-autobuild>=2024.4",
    "django>=4.2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.black]
line-length = 79
target-version = ["py312"]
exclude = "/migrations/"

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = ["migrations"]

[tool.isort]
profile = "black"
line_length = 79

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "D"]
ignore = ["D203", "D212", "D104", "D105", "D106", "D107", "D102"]

[tool.ruff.lint.per-file-ignores]
"**/admin.py" = ["D100", "D101"]
"**/apps.py" = ["D101"]
"**/tests/**/*.py" = ["D100", "D101"]
"**/migrations/**/*.py" = ["D100", "D101", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=apps --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
exclude = ".*/migrations/.*"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
